plugins {
    id 'java'
    id 'nu.studer.jooq' version '6.0'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group 'org.example'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // JUnit
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.8.1'

    // Log4j
    implementation 'org.apache.logging.log4j:log4j-core:2.23.0'

    // SLF4J to load 'org.slf4j.impl.StaticLoggerBinder'
    implementation 'org.slf4j:slf4j-nop:1.7.36'

    // Gson
    implementation 'com.google.code.gson:gson:2.8.8'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'

    // Mockito
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'

    // BCrypt and SQLite
    implementation 'org.mindrot:jbcrypt:0.4'
    implementation 'org.xerial:sqlite-jdbc:3.46.0.0'

    // PostgreSQL
    implementation 'org.postgresql:postgresql:42.5.0'

    // JOOQ
    implementation 'org.jooq:jooq:3.19.10'
    implementation 'org.jooq:jooq-meta:3.19.10'
    implementation 'org.jooq:jooq-codegen:3.19.10'
    jooqGenerator 'org.postgresql:postgresql:42.2.24'
}

jooq {
    version = '3.19.10'
    configurations {
        main {
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = 'jdbc:postgresql://localhost:5432/mailbox_db'
                    user = 'mail_user'
                    password = 'mail123'
                }
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        includes = '.*'
                        excludes = ''
                        inputSchema = 'public'
                    }
                    target {
                        packageName = 'jooq'
                        directory = 'target'
                    }
                }
            }
        }
    }
}

shadowJar {
    archiveBaseName.set('ServerLauncher')
    archiveClassifier.set('')
    archiveVersion.set('')
    manifest {
        attributes("Main-Class": "com.jakub.bone.server.ServerLauncher")
    }
}

test {
    useJUnitPlatform()
}
